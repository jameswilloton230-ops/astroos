set timeout=5
set default=0

menuentry "AstroOS" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret
    initrd /boot/initrd
}

menuentry "AstroOS (Debug)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret ASTROOS_GL_DEBUG=1
    initrd /boot/initrd
}

menuentry "AstroOS (Logging disabled)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret ASTROOS_GL_DEBUG=0
    initrd /boot/initrd
}

menuentry "AstroOS (Recovery)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret astroos.recovery=1
    initrd /boot/initrd
}
