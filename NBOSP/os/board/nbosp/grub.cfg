set timeout=5
set default=0

menuentry "NBOSP" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret
    initrd /boot/initrd
}

menuentry "NBOSP (Debug)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret NBOSP_GL_DEBUG=1
    initrd /boot/initrd
}

menuentry "NBOSP (Logging disabled)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret NBOSP_GL_DEBUG=0
    initrd /boot/initrd
}

menuentry "NBOSP (Recovery)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 net.ifnames=0 spec_rstack_overflow=safe-ret nbosp.recovery=1
    initrd /boot/initrd
}
