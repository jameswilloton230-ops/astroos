<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <!-- AstroOS fonts (Outfit / JetBrains Mono) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=JetBrains+Mono:wght@400..600&display=swap">
  <style>
    /* AstroOS Lineage Material Dark — matches the OS shell theme */
    :root {
      --bg-base: #0f0f0f;
      --bg-elevated: #1a1a1a;
      --bg-overlay: #222222;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-muted: #5a5a5a;
      --text-danger: #ef5350;
      --border-default: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --accent: #4dd0e1;
      --accent-hover: #80deea;
      --r-xs: 8px;
      --r-sm: 12px;
      --r-md: 16px;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --font-ui: 'Outfit', system-ui, sans-serif;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { color: var(--text-primary); font-family: var(--font-ui); }
  </style>
</head>
<body>
  <main id="calculator-root" aria-label="Calculator" style="width:100%;height:100%"></main>
  <script src="app.js"></script>
</body>
</html>
