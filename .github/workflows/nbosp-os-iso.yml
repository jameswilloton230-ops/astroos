name: Build NBOSP OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: NBOSP/package-lock.json

      - name: Cache NW.js SDK
        uses: actions/cache@v4
        with:
          path: NBOSP/.nwjs-cache
          key: nwjs-sdk-${{ runner.os }}-${{ hashFiles('NBOSP/package.json') }}
          restore-keys: |
            nwjs-sdk-${{ runner.os }}-

      - name: Install NBOSP dependencies
        working-directory: NBOSP
        run: npm ci

      - name: Verify NBOSP OS integration contracts
        run: >-
          node --test
          NBOSP/os/package/nbosp-kiosk/test-cage-kiosk.mjs

      - name: Build Linux NW.js app
        working-directory: NBOSP
        run: node build.mjs linux

      - name: Verify Linux NW.js runtime libraries
        run: test -f build/linux-x64/lib/libffmpeg.so

      - name: Prepare NW.js app for Wayland kiosk
        run: |
          node NBOSP/os/package/nbosp-kiosk/prepare-kiosk.mjs build/linux-x64
          mkdir -p NBOSP/os/package/nbosp-kiosk/source
          cp -a build/linux-x64/. NBOSP/os/package/nbosp-kiosk/source/

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Verify NW.js Node integration under Xvfb
        run: xvfb-run -a node NBOSP/os/package/nbosp-kiosk/test-nw-node.mjs build/linux-x64/NovaByte build/linux-x64/package.nw

      - name: Install Buildroot and ISO host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex file wget cpio unzip rsync \
            python3 perl patch gzip bzip2 xz-utils libncurses-dev libelf-dev libssl-dev curl \
            grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Cache Buildroot source and downloads
        uses: actions/cache@v4
        with:
          path: |
            NBOSP/os/.buildroot
            NBOSP/os/.downloads
          key: nbosp-buildroot-source-${{ runner.os }}-${{ hashFiles('NBOSP/os/build-iso.sh') }}
          restore-keys: |
            nbosp-buildroot-source-${{ runner.os }}-

      - name: Cache Buildroot compiled output
        id: cache-buildroot-output
        uses: actions/cache@v4
        with:
          path: NBOSP/os/output
          key: nbosp-buildroot-output-v4-${{ runner.os }}-${{ hashFiles('NBOSP/os/build-iso.sh', 'NBOSP/os/configs/**', 'NBOSP/os/board/**', 'NBOSP/os/package/nbosp-kiosk/**', 'NBOSP/os/package/nbosp-install/**', 'NBOSP/os/package/nbosp-power/**', 'NBOSP/os/Config.in', 'NBOSP/os/external.*') }}
          restore-keys: |
            nbosp-buildroot-output-v4-${{ runner.os }}-

      - name: Build bootable NBOSP ISO
        run: bash NBOSP/os/build-iso.sh

      - name: Save Buildroot output after a failed build
        if: failure() && steps.cache-buildroot-output.outputs.cache-hit != 'true' && hashFiles('NBOSP/os/output/.config') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: NBOSP/os/output
          key: nbosp-buildroot-output-v4-${{ runner.os }}-${{ hashFiles('NBOSP/os/build-iso.sh', 'NBOSP/os/configs/**', 'NBOSP/os/board/**', 'NBOSP/os/package/nbosp-kiosk/**', 'NBOSP/os/package/nbosp-install/**', 'NBOSP/os/package/nbosp-power/**', 'NBOSP/os/Config.in', 'NBOSP/os/external.*') }}

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nbosp-live-x86_64
          path: NBOSP/os/output/images/nbosp-live.iso
          if-no-files-found: error
          retention-days: 14
